name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: offline-${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - database: postgres
            image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          - database: pgvector
            image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:cd4ccfdaf62cbfeb5c6ee19ef0dd663406d4ed740c320b324d016a90e85385b3
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_PASSWORD: kestri-test-only
          POSTGRES_DB: kestri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kestri_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      KESTRI_TEST_DATABASE_URL: postgresql://postgres:kestri-test-only@127.0.0.1:5432/kestri_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy src scripts
      - run: uv run pytest -q
      - run: uv run python scripts/check_docs.py
      - run: uv run python scripts/check_sql_readability.py
      - run: uv run python scripts/evaluate_controls.py
      - run: uv build
