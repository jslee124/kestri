[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kestri"
version = "0.1.0"
description = "A local personal AI agent with controlled tools and explicit task agreements."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.28,<1",
  "langchain>=1.0,<2",
  "langchain-deepseek>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "langsmith>=0.4,<1",
  "openai>=2,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.0,<3",
  "pydantic-settings>=2.0,<3",
  "socksio>=1,<2",
]

[project.scripts]
kestri = "kestri.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.13,<1",
  "mypy>=1.18,<2",
  "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kestri"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
